name: Deploy Tenovo

on:
  workflow_dispatch:
  push:
    branches:
      - deploy

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout deploy branch
        uses: actions/checkout@v4

      - name: Prepare release folder
        run: |
          rm -rf release
          mkdir -p release

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='release' \
            --exclude='.env*' \
            ./ release/

          printf "%s" "${{ secrets.PRODUCTION_ENV }}" > release/.env.production
          chmod -R u+rwX,go+rX release

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "release/*,release/.env.production"
          target: ${{ secrets.SERVER_APP_DIR }}
          rm: true
          strip_components: 1
          overwrite: true

      - name: Secure env and run Docker deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_DIR
          script: |
            cd "$APP_DIR"
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build app postgres redis
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
            docker image prune -f